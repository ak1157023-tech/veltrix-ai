<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>VELTRIX AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230b0b10'/%3E%3Cpolygon points='92,136 196,136 300,400 236,400' fill='%238b5cf6'/%3E%3Cpolygon points='316,84 420,84 318,400 268,400 300,300 268,236' fill='%232dc4ff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#08080b;--panel:#121217;--raised:#1a1a22;--line:#2a2a35;--violet:#8b5cf6;--volt:#2dc4ff;--mute:#9a9aa8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:#e4e4ea;font-family:Sora,system-ui,sans-serif;display:flex;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
aside{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px;padding:20px;font-weight:600;letter-spacing:.04em}
.brand svg{width:36px;height:36px}
nav{overflow-y:auto;padding:0 12px 16px;flex:1}
nav a{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;color:var(--mute);text-decoration:none;font-size:14px;border-left:2px solid transparent}
nav a:hover{background:var(--raised);color:#fff}
nav a.on{background:var(--raised);color:#fff;border-left-color:var(--volt)}
nav small{color:#5b5b69;font-size:11px}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header button{width:44px;height:44px;border:0;border-radius:8px;background:var(--raised);color:#fff;font-size:20px}
main{flex:1;overflow-y:auto;padding:40px}
h1{font-size:28px;margin:0 0 8px}
p{color:var(--mute);line-height:1.6;max-width:60ch}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:8px;background:linear-gradient(100deg,var(--violet),var(--volt));color:#08080b;font-weight:600;text-decoration:none;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:24px;max-width:760px}
.card h2{margin:0 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:12px}
.chip{background:var(--raised);border-radius:8px;padding:8px 12px;font-size:13px}
.warn{color:#fbbf24}
.todo{border:1px dashed var(--line);border-radius:12px;padding:24px;margin-top:24px;max-width:560px;color:var(--mute);font-size:14px}
.todo b{color:var(--volt);font-weight:600}
#scrim{display:none}
@media(max-width:900px){
  aside{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  body.open aside{transform:none}
  body.open #scrim{display:block;position:fixed;inset:0;background:#0009;z-index:30}
  header{display:flex}main{padding:20px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="scrim"></div>
<aside>
  <div class="brand">
    <svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0b0b10"/><polygon points="92,136 196,136 300,400 236,400" fill="#8b5cf6"/><polygon points="316,84 420,84 318,400 268,400 300,300 268,236" fill="#2dc4ff"/></svg>
    VELTRIX AI
  </div>
  <nav id="nav"></nav>
</aside>
<div class="wrap">
  <header><button id="menu" aria-label="Open menu">☰</button><b>VELTRIX AI</b></header>
  <main id="main"></main>
</div>
<script>
// phase = build phase in which the page becomes functional
const PAGES=[
 {id:"dashboard",label:"Dashboard",phase:1,blurb:""},
 {id:"clip-maker",label:"AI Movie Clip Maker",phase:4,blurb:"Upload a movie, review the best scenes, export clips as a ZIP."},
 {id:"editor",label:"Video Editor",phase:3,blurb:"Trim, convert and edit on a timeline."},
 {id:"scenes",label:"Scene Detector",phase:5,blurb:"Find scene changes and rank highlights."},
 {id:"watermark",label:"Watermark Studio",phase:7,blurb:"Add text or logo watermarks to one clip or all clips."},
 {id:"subtitles",label:"Subtitle Generator",phase:6,blurb:"Generate captions from speech with Whisper."},
 {id:"audio",label:"Audio Studio",phase:6,blurb:"Noise reduction, silence removal and music replacement."},
 {id:"projects",label:"My Projects",phase:2,blurb:"Your uploaded videos and generated clips."},
 {id:"export",label:"Batch Export Center",phase:8,blurb:"Queue, monitor and download exports."},
 {id:"settings",label:"Settings",phase:10,blurb:"Storage, encoders and account."}
];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const id=location.hash.slice(1)||"dashboard";
  const p=PAGES.find(x=>x.id===id)||PAGES[0];
  $("#nav").innerHTML=PAGES.map(x=>`<a href="#${x.id}" class="${x.id===p.id?"on":""}">${x.label}${x.phase>1?`<small>Phase ${x.phase}</small>`:""}</a>`).join("");
  document.body.classList.remove("open");
  if(p.id==="dashboard"){dashboard();return}
  $("#main").innerHTML=`<h1>${p.label}</h1><p>${p.blurb}</p><div class="todo">This tool is not built yet. It becomes available in <b>Phase ${p.phase}</b>.</div>`;
}

function dashboard(){
  $("#main").innerHTML=`<h1>Turn a full movie into ready-to-post clips</h1>
  <p>Upload a video you own or are licensed to edit. VELTRIX AI finds the strongest scenes and exports them together.</p>
  <a class="btn" href="#clip-maker">Open AI Movie Clip Maker</a>
  <div class="card"><h2>Export engine</h2><div id="sys" style="color:var(--mute);font-size:14px">Checking this machine…</div></div>
  <div class="card"><h2>Projects</h2><p style="margin:0;font-size:14px">No projects yet. Uploading arrives in Phase 2.</p></div>`;
  fetch("/api/system").then(r=>r.json()).then(s=>{
    $("#sys").innerHTML=!s.ffmpeg
      ?`<span class="warn">FFmpeg was not found. Install it, open a new terminal, and check that <code>ffmpeg -version</code> works.</span>`
      :`${esc(s.version)}<div class="grid">${s.encoders.map(e=>`<div class="chip">${esc(e)}</div>`).join("")}</div>
        <p style="font-size:12px;margin-top:12px">Hardware encoders only work if the matching GPU is present. This is verified in Phase 8.</p>`;
  }).catch(()=>{$("#sys").innerHTML=`<span class="warn">The server is not running. Start it with start.bat.</span>`});
}

$("#menu").onclick=()=>document.body.classList.add("open");
$("#scrim").onclick=()=>document.body.classList.remove("open");
addEventListener("hashchange",render);
render();
</script>
</body>
</html>
